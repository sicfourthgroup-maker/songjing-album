name: warm-cdn
on:
  push:
    paths: ["stickers/**"]
  workflow_dispatch:
jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: warm jsDelivr for this commit
        run: |
          base="sicfourthgroup-maker/songjing-album"
          echo "STICKER COMMIT: $GITHUB_SHA"
          for f in stickers/*; do
            for i in 1 2; do
              curl -s -o /dev/null -w "%{http_code} $f\n" "https://cdn.jsdelivr.net/gh/$base@$GITHUB_SHA/$f"
            done
          done
