name: update-album
on:
  push:
    paths: ["snaps/**", "stickers/**", "scripts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/make_readme.py
      - run: |
          git config user.name "songjing-bot"
          git config user.email "songjing-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "update album page"
          git push
